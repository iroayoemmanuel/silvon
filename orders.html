<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVON — My Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060c1a'/%3E%3Ctext x='16' y='23' font-family='serif' font-size='20' fill='%23d9b56a' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <meta name="description" content="View your SILVON orders and their status.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="nav">
        <div class="wrap nav-inner">
            <input type="checkbox" id="navToggle" class="nav-toggle">
            <label for="navToggle" class="nav-toggle-label" aria-label="Toggle menu">&#9776;</label>
            <a class="brand" href="index.html">SIL<span>V</span>ON</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="orders.html" class="active">Orders</a></li>
                <li><a href="reservations.html">Reservations</a></li>
            </ul>
        </div>
    </header>

    <section class="section">
        <div class="wrap">
            <div class="section-head">
                <div class="eyebrow">Your Activity</div>
                <h2>My Orders</h2>
            </div>
            <div id="ordersList"></div>
            <p class="orders-note">Orders are stored in this browser. Place an order from the <a href="menu.html" style="color:var(--gold)">Menu</a> to see it here.</p>
        </div>
    </section>

    <footer>
        <div class="wrap">
            <a class="brand" href="index.html">SIL<span style="color:var(--gold)">V</span>ON</a>
            <p class="meta">
                <strong>Hours:</strong> Tue–Sun, 5pm–11pm &nbsp;•&nbsp;
                <strong>Location:</strong> Omuaran, Kwara State
            </p>

            <p class="meta" style="margin-top:8px;">&copy; 2026 SILVON. Crafted for the table.</p>
        </div>
    </footer>

    <script>
        const listEl = document.getElementById('ordersList');
        const ORDERS_KEY = 'silvon_orders';

        function money(n) {
            return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function fmtDate(iso) {
            try { return new Date(iso).toLocaleString(); } catch (e) { return ''; }
        }

        let orders = [];
        try { orders = JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; } catch (e) {}

        if (orders.length === 0) {
            listEl.innerHTML = '<p class="order-empty">You have no orders yet.</p>';
        } else {
            listEl.innerHTML = orders.slice().reverse().map(function (o) {
                const items = o.items.map(function (i) {
                    return '<div class="order-item"><span>' + escapeHtml(i.name) + ' × ' + i.qty + '</span><span>' + money(i.price * i.qty) + '</span></div>';
                }).join('');
                return '<div class="order-card">' +
                    '<h3>Order <span class="order-no">' + escapeHtml(o.orderNo) + '</span></h3>' +
                    '<div class="order-meta">' + escapeHtml(o.name) + ' • ' + escapeHtml(o.phone) + '<br>' + fmtDate(o.created) + '</div>' +
                    items +
                    '<div class="order-total"><span>Total</span><span class="amt">' + money(o.total) + '</span></div>' +
                '</div>';
            }).join('');
        }
    </script>

</body>
</html>
